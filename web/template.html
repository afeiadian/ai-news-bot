<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 资讯日报</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Verdana, Geneva, sans-serif;
      font-size: 14px;
      background: #f6f6ef;
      color: #000;
    }

    #header {
      background: #ff6600;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #header .logo {
      background: #fff;
      color: #ff6600;
      font-weight: bold;
      font-size: 16px;
      padding: 2px 6px;
      border-radius: 2px;
    }
    #header .site-title { color: #fff; font-weight: bold; font-size: 14px; }
    #header .nav-links  { margin-left: auto; color: #fff; font-size: 12px; opacity: 0.85; }
    #sources-btn {
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.5);
      color: #fff;
      font-size: 12px;
      padding: 2px 10px;
      border-radius: 3px;
      cursor: pointer;
      margin-left: 16px;
      white-space: nowrap;
    }
    #visit-count {
      margin-left: auto;
      color: #fff;
      font-size: 12px;
      opacity: 0.92;
      white-space: nowrap;
    }
    #visit-count strong { font-weight: bold; }
    #sources-btn:hover { background: rgba(255,255,255,0.3); }

    /* 弹窗 */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      overflow-y: auto;
      padding: 40px 16px;
    }
    #modal-overlay.open { display: block; }
    #modal-box {
      background: #fff;
      max-width: 760px;
      margin: 0 auto;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }
    #modal-header {
      background: #ff6600;
      color: #fff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #modal-header h2 { font-size: 15px; font-weight: bold; }
    #modal-close {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
      padding: 0 4px;
    }
    #modal-close:hover { opacity: 0.7; }
    #modal-body {
      padding: 20px;
      font-size: 13px;
      line-height: 1.6;
      color: #333;
    }
    .modal-section { margin-bottom: 24px; }
    .modal-section h3 {
      font-size: 13px;
      font-weight: bold;
      color: #ff6600;
      border-bottom: 1px solid #f0e0d0;
      padding-bottom: 4px;
      margin-bottom: 10px;
    }
    .modal-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .modal-table th {
      background: #f6f6ef;
      text-align: left;
      padding: 4px 8px;
      border: 1px solid #e0e0d8;
      color: #555;
      font-weight: bold;
    }
    .modal-table td {
      padding: 4px 8px;
      border: 1px solid #e0e0d8;
      vertical-align: top;
    }
    .modal-table tr:nth-child(even) td { background: #fafaf7; }
    .modal-tag {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 11px;
      color: #fff;
      font-weight: bold;
      margin: 1px 2px;
    }
    .modal-note {
      background: #f6f6ef;
      border-left: 3px solid #ff6600;
      padding: 8px 12px;
      font-size: 12px;
      color: #555;
      white-space: pre-line;
    }

    #main {
      max-width: 960px;
      margin: 0 auto;
      padding: 8px 4px;
    }

    /* 筛选栏 */
    #filter-bar {
      padding: 6px 4px 10px 4px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .filter-label {
      font-size: 11px;
      color: #828282;
      width: 48px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .filter-btn {
      font-size: 11px;
      padding: 2px 7px;
      border: 1px solid #ccc;
      border-radius: 3px;
      background: #fff;
      cursor: pointer;
      color: #333;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: background 0.1s;
    }
    .filter-btn:hover { background: #f0f0f0; }
    .filter-btn.active {
      background: #ff6600;
      color: #fff;
      border-color: #ff6600;
    }
    .filter-btn.active .btn-count { background: rgba(255,255,255,0.25); color: #fff; }

    /* 话题按钮激活时用各自颜色 */
    .filter-btn.topic-active {
      background: var(--topic-color, #374151);
      color: #fff;
      border-color: var(--topic-color, #374151);
    }
    .filter-btn.topic-active .btn-count { background: rgba(255,255,255,0.25); color: #fff; }

    /* 0篇时变灰 */
    .btn-empty {
      opacity: 0.45;
      cursor: default;
    }
    .btn-empty:hover { background: #fff; }

    #date-select {
      font-size: 11px;
      padding: 2px 6px;
      border: 1px solid #ccc;
      border-radius: 3px;
      background: #fff;
      color: #333;
      cursor: pointer;
      height: 24px;
    }
    #date-select:focus { outline: none; border-color: #ff6600; }

    .btn-count {
      font-size: 10px;
      background: #e8e8e8;
      color: #555;
      padding: 0 4px;
      border-radius: 8px;
      min-width: 16px;
      text-align: center;
    }

    /* 文章列表 */
    .item-list { width: 100%; border-collapse: collapse; }
    .item-row td { padding: 4px 4px 0 4px; vertical-align: top; }

    .rank {
      color: #828282;
      font-size: 13px;
      text-align: right;
      padding-right: 6px !important;
      width: 30px;
      padding-top: 6px !important;
    }

    .title-block {
      border-left: 3px solid #ff6600;
      padding-left: 8px;
      margin-bottom: 4px;
    }

    .title-link {
      font-size: 17px;
      font-weight: 500;
      color: #555;
      text-decoration: none;
      line-height: 1.4;
      display: block;
    }
    .title-link:hover   { text-decoration: underline; }
    .title-link:visited { color: #999; }

    .title-zh {
      font-size: 15px;
      font-weight: bold;
      color: #111;
      margin-top: 3px;
      line-height: 1.4;
    }

    .topic-tags {
      margin-top: 5px;
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .summary {
      font-size: 12px;
      color: #444;
      margin-top: 4px;
      line-height: 1.5;
      max-width: 820px;
      padding: 4px 8px;
      background: #eef1f5;
      border-radius: 2px;
    }

    .meta {
      font-size: 11px;
      color: #828282;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .tag {
      color: #fff;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: bold;
    }

    .source-cat { font-weight: bold; font-size: 11px; }
    .dot   { color: #ccc; }
    .score { color: #b45309; font-weight: bold; margin-right: 4px; }
    .hotness-label { color: #b45309; font-weight: bold; margin-right: 3px; }
    .stars { color: #f59e0b; font-size: 12px; letter-spacing: 1px; margin-right: 4px; }
    .pub-date {
      margin-left: auto;
      color: #aaa;
      font-size: 11px;
      white-space: nowrap;
    }
    .spacer td { height: 24px; }

    .show-original-btn {
      font-size: 11px;
      padding: 1px 7px;
      border: 1px solid #d0d0c8;
      border-radius: 3px;
      background: #f4f4ef;
      cursor: pointer;
      color: #666;
      margin-top: 5px;
      display: inline-block;
    }
    .show-original-btn:hover { background: #e8e8e0; }

    .original-content {
      display: none;
      max-height: 160px;
      overflow-y: auto;
      margin-top: 5px;
      padding: 7px 10px;
      background: #f9f9f6;
      border: 1px solid #e0e0d8;
      border-radius: 3px;
      font-size: 12px;
      color: #333;
      white-space: pre-wrap;
      line-height: 1.55;
      word-break: break-word;
    }

    /* 结果统计 */
    #result-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 4px 14px 4px;
      font-size: 12px;
      color: #828282;
      border-top: 1px solid #e0e0d8;
      margin-top: 10px;
    }

    #result-right { display: flex; align-items: center; gap: 16px; }
    #sort-bar { display: flex; align-items: center; gap: 4px; }

    .sort-btn {
      font-size: 11px;
      padding: 2px 8px;
      border: 1px solid #ccc;
      border-radius: 3px;
      background: #fff;
      cursor: pointer;
      color: #333;
    }
    .sort-btn:hover { background: #f0f0f0; }
    .sort-btn.active {
      background: #ff6600;
      color: #fff;
      border-color: #ff6600;
      font-weight: bold;
    }

    /* 分页 */
    #pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 16px 4px 8px 4px;
      flex-wrap: wrap;
    }
    .page-btn {
      font-size: 12px;
      padding: 3px 9px;
      border: 1px solid #ccc;
      border-radius: 3px;
      background: #fff;
      cursor: pointer;
      color: #333;
      min-width: 30px;
      text-align: center;
    }
    .page-btn:hover  { background: #f0f0f0; }
    .page-btn.active { background: #ff6600; color: #fff; border-color: #ff6600; font-weight: bold; }
    .page-btn:disabled { opacity: 0.4; cursor: default; }
    .page-ellipsis { font-size: 12px; color: #828282; padding: 3px 4px; }

    #footer {
      text-align: center;
      padding: 16px;
      font-size: 11px;
      color: #828282;
      border-top: 1px solid #e0e0e0;
      margin-top: 8px;
    }

    @media (max-width: 600px) {
      .title-link { font-size: 13px; }
      #main { padding: 4px 2px; }
    }
  </style>
</head>
<body>

<div id="header">
  <span class="logo">AI</span>
  <span class="site-title">AI 资讯日报</span>
  <button id="sources-btn" onclick="openModal()">数据来源 &amp; 评分标准</button>
  <span id="visit-count">累计浏览 <strong id="visit-num">···</strong></span>
</div>

<!-- 弹窗 -->
<div id="modal-overlay" onclick="handleOverlayClick(event)">
  <div id="modal-box">
    <div id="modal-header">
      <h2>数据来源 &amp; 评分标准</h2>
      <button id="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body">
      {{SOURCES_CONTENT}}
    </div>
  </div>
</div>

<div id="main">
  <div id="filter-bar">
    <!-- 日期 -->
    <div class="filter-row">
      <span class="filter-label">日期：</span>
      <button class="filter-btn range-btn active" data-date="all" onclick="filterDate(this)">全部</button>
      <button class="filter-btn range-btn" data-date="0"  onclick="filterDate(this)">今天</button>
      <button class="filter-btn range-btn" data-date="1"  onclick="filterDate(this)">昨天</button>
      <button class="filter-btn range-btn" data-date="3"  onclick="filterDate(this)">近3天</button>
      <button class="filter-btn range-btn" data-date="7"  onclick="filterDate(this)">近7天</button>
      <button class="filter-btn range-btn" data-date="30" onclick="filterDate(this)">近30天</button>
      <select id="date-select" onchange="filterExactDate(this)">
        {{DATE_OPTIONS}}
      </select>
    </div>
    <!-- 来源分类 -->
    <div class="filter-row">
      <span class="filter-label">来源：</span>
      <button class="filter-btn active" data-cat="all" onclick="filterCat(this)">全部 <span class="btn-count">{{COUNT}}</span></button>
      {{CAT_BUTTONS}}
    </div>
    <!-- 话题分类 -->
    <div class="filter-row">
      <span class="filter-label">话题：</span>
      <button class="filter-btn active" data-topic="all" onclick="filterTopic(this)">全部</button>
      {{TOPIC_BUTTONS}}
    </div>
    <!-- 相关度 -->
    <div class="filter-row">
      <span class="filter-label">相关度：</span>
      <button class="filter-btn active" data-score="0"  onclick="filterScore(this)">全部</button>
      <button class="filter-btn"        data-score="70" onclick="filterScore(this)">70+</button>
      <button class="filter-btn"        data-score="80" onclick="filterScore(this)">80+</button>
      <button class="filter-btn"        data-score="90" onclick="filterScore(this)">90+</button>
    </div>
    <!-- 热度 -->
    <div class="filter-row">
      <span class="filter-label">热度：</span>
      <button class="filter-btn active" data-hotness="0" data-hotness-max="9" onclick="filterHotness(this)">全部</button>
      <button class="filter-btn" data-hotness="2" data-hotness-max="9" onclick="filterHotness(this)">2星以上</button>
      <button class="filter-btn" data-hotness="3" data-hotness-max="9" onclick="filterHotness(this)">3星以上</button>
      <button class="filter-btn" data-hotness="4" data-hotness-max="9" onclick="filterHotness(this)">4星以上</button>
      <button class="filter-btn" data-hotness="5" data-hotness-max="9" onclick="filterHotness(this)">5星</button>
    </div>
  </div>

  <div id="result-bar">
    <span id="result-count"></span>
    <div id="result-right">
      <div id="sort-bar">
        <span style="font-size:11px;color:#828282;">排序：</span>
        <button class="sort-btn active" data-sort="hotness" onclick="setSort(this)">热度</button>
        <button class="sort-btn" data-sort="score" onclick="setSort(this)">相关度</button>
        <button class="sort-btn" data-sort="date" onclick="setSort(this)">时间</button>
      </div>
      <span id="page-info"></span>
    </div>
  </div>

  <table class="item-list" id="item-list">
    {{ITEMS}}
  </table>

  <div id="pagination"></div>

  <div id="footer">
    共 {{COUNT}} 条资讯 · 更新于 {{UPDATED}} · 数据来源：arXiv / HN / Reddit / RSS / X
  </div>
</div>

<script>
  const PAGE_SIZE = 30;
  let activeCat      = 'all';
  let activeTopic    = 'all';
  let activeDays     = 'all';
  let activeExact    = '';
  let activeScore    = 0;
  let activeHotness  = 0;
  let activeHotnessMax = 9;
  let sortBy   = 'hotness';
  let sortDesc = true;
  let currentPage = 1;

  const table   = document.getElementById('item-list');
  const allRows = Array.from(document.querySelectorAll('.item-row'));

  // 预先记录每行对应的 spacer（初始化后 DOM 操作可能改变 nextElementSibling）
  const spacerOf = new Map();
  allRows.forEach(row => spacerOf.set(row, row.nextElementSibling));

  function getLocalDateStr(daysAgo) {
    const d = new Date();
    d.setDate(d.getDate() - daysAgo);
    // 用本地时区年-月-日（不要用 toISOString 那是 UTC）
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  // 把 published_at 转为本地时区的 YYYY-MM-DD
  function isoToLocalDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  // 预先把每行的本地日期算好，存到 row.dataset.localDate
  document.querySelectorAll('.item-row[data-iso]').forEach(r => {
    r.dataset.localDate = isoToLocalDate(r.dataset.iso) || r.dataset.date;
  });

  function getVisibleRows() {
    return allRows.filter(row => {
      const catOk     = activeCat   === 'all' || row.dataset.category === activeCat;
      const topicOk   = activeTopic === 'all' || row.dataset.topic.split(',').map(t => t.trim()).includes(activeTopic);
      const scoreOk   = parseInt(row.dataset.score   || 0) >= activeScore;
      const h         = parseInt(row.dataset.hotness || 0);
      const hotnessOk = h >= activeHotness && h <= activeHotnessMax;
      let dateOk = true;
      const rowDate = row.dataset.localDate || row.dataset.date;
      if (activeExact) {
        dateOk = rowDate === activeExact;
      } else if (activeDays !== 'all') {
        dateOk = rowDate >= getLocalDateStr(parseInt(activeDays));
      }
      return catOk && topicOk && scoreOk && hotnessOk && dateOk;
    });
  }

  function sortedRows(rows) {
    const dir = sortDesc ? 1 : -1;
    return [...rows].sort((a, b) => {
      let d = 0;
      if (sortBy === 'hotness') {
        d = (parseInt(b.dataset.hotness || 0) - parseInt(a.dataset.hotness || 0)) * dir;
      } else if (sortBy === 'score') {
        d = (parseInt(b.dataset.score || 0) - parseInt(a.dataset.score || 0)) * dir;
      } else {
        d = b.dataset.date.localeCompare(a.dataset.date) * dir;
      }
      // 同分时按时间降序兜底
      return d !== 0 ? d : b.dataset.date.localeCompare(a.dataset.date);
    });
  }

  function matchesBase(row) {
    // 应用日期、相关度、热度（不应用来源/话题）
    const scoreOk = parseInt(row.dataset.score || 0) >= activeScore;
    const h = parseInt(row.dataset.hotness || 0);
    const hotnessOk = h >= activeHotness && h <= activeHotnessMax;
    let dateOk = true;
    const rowDate = row.dataset.localDate || row.dataset.date;
    if (activeExact) dateOk = rowDate === activeExact;
    else if (activeDays !== 'all') dateOk = rowDate >= getLocalDateStr(parseInt(activeDays));
    return scoreOk && hotnessOk && dateOk;
  }

  function updateFacetCounts() {
    // 来源 count：忽略当前来源选择，应用其他筛选
    const catCounts = {};
    let catAllTotal = 0;
    allRows.forEach(row => {
      if (!matchesBase(row)) return;
      if (activeTopic !== 'all') {
        const topics = (row.dataset.topic || '').split(',').map(t => t.trim());
        if (!topics.includes(activeTopic)) return;
      }
      const c = row.dataset.category;
      catCounts[c] = (catCounts[c] || 0) + 1;
      catAllTotal++;
    });
    document.querySelectorAll('#filter-bar [data-cat]').forEach(btn => {
      const c = btn.dataset.cat;
      const countEl = btn.querySelector('.btn-count');
      const n = c === 'all' ? catAllTotal : (catCounts[c] || 0);
      if (countEl) countEl.textContent = n;
      if (c !== 'all') {
        if (n === 0) btn.classList.add('btn-empty');
        else btn.classList.remove('btn-empty');
      }
    });

    // 话题 count：忽略当前话题选择，应用其他筛选
    const topicCounts = {};
    let topicAllTotal = 0;
    allRows.forEach(row => {
      if (!matchesBase(row)) return;
      if (activeCat !== 'all' && row.dataset.category !== activeCat) return;
      const topics = (row.dataset.topic || '').split(',').map(t => t.trim()).filter(Boolean);
      if (topics.length) topicAllTotal++;
      topics.forEach(t => { topicCounts[t] = (topicCounts[t] || 0) + 1; });
    });
    document.querySelectorAll('#filter-bar [data-topic]').forEach(btn => {
      const t = btn.dataset.topic;
      const countEl = btn.querySelector('.btn-count');
      if (t === 'all') return;
      const n = topicCounts[t] || 0;
      if (countEl) countEl.textContent = n;
      if (n === 0) btn.classList.add('btn-empty');
      else btn.classList.remove('btn-empty');
    });
  }

  function render() {
    updateFacetCounts();
    const visible  = sortedRows(getVisibleRows());
    const total    = visible.length;
    const pages    = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (currentPage > pages) currentPage = pages;

    const start     = (currentPage - 1) * PAGE_SIZE;
    const pageItems = visible.slice(start, start + PAGE_SIZE);
    const pageSet   = new Set(pageItems);

    // 按正确顺序重新插入 DOM，实现真正的排序
    pageItems.forEach(row => {
      table.appendChild(row);
      const sp = spacerOf.get(row);
      if (sp) table.appendChild(sp);
    });
    // 隐藏行追加到末尾（不影响显示）
    allRows.filter(r => !pageSet.has(r)).forEach(row => {
      table.appendChild(row);
      const sp = spacerOf.get(row);
      if (sp) table.appendChild(sp);
    });

    // 显示 / 隐藏
    allRows.forEach(row => {
      const show = pageSet.has(row);
      row.style.display = show ? '' : 'none';
      const sp = spacerOf.get(row);
      if (sp) sp.style.display = show ? '' : 'none';
    });

    // 全局连续编号
    visible.forEach((row, idx) => { row.querySelector('.rank').textContent = idx + 1; });

    document.getElementById('result-count').textContent =
      total === 0 ? '暂无符合条件的资讯' : `共 ${total} 条`;
    document.getElementById('page-info').textContent =
      total === 0 ? '' : `第 ${currentPage} / ${pages} 页`;

    renderPagination(pages);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderPagination(pages) {
    const el = document.getElementById('pagination');
    if (pages <= 1) { el.innerHTML = ''; return; }
    let html = `<button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹ 上一页</button>`;
    const range = getPageRange(currentPage, pages);
    let prev = null;
    range.forEach(p => {
      if (prev !== null && p - prev > 1) html += `<span class="page-ellipsis">…</span>`;
      html += `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="goPage(${p})">${p}</button>`;
      prev = p;
    });
    html += `<button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage === pages ? 'disabled' : ''}>下一页 ›</button>`;
    el.innerHTML = html;
  }

  function getPageRange(cur, total) {
    const delta = 2, range = new Set([1, total]);
    for (let i = Math.max(2, cur - delta); i <= Math.min(total - 1, cur + delta); i++) range.add(i);
    return Array.from(range).sort((a, b) => a - b);
  }

  const SORT_LABELS = { hotness: '热度', score: '相关度', date: '时间' };

  function setSort(btn) {
    const key = btn.dataset.sort;
    if (key === sortBy) {
      // 再次点击：切换升降序
      sortDesc = !sortDesc;
    } else {
      sortDesc = true;
      sortBy = key;
      document.querySelectorAll('.sort-btn').forEach(b => {
        b.classList.remove('active');
        b.textContent = SORT_LABELS[b.dataset.sort] || b.dataset.sort;
      });
      btn.classList.add('active');
    }
    btn.textContent = SORT_LABELS[key] + (sortDesc ? ' ↓' : ' ↑');
    currentPage = 1;
    render();
  }

  function goPage(p) {
    const pages = Math.max(1, Math.ceil(sortedRows(getVisibleRows()).length / PAGE_SIZE));
    if (p < 1 || p > pages) return;
    currentPage = p; render();
  }

  function filterCat(btn) {
    if (btn.classList.contains('btn-empty')) return;
    document.querySelectorAll('#filter-bar [data-cat]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCat = btn.dataset.cat;
    currentPage = 1; render();
  }

  function filterTopic(btn) {
    if (btn.classList.contains('btn-empty')) return;
    document.querySelectorAll('#filter-bar [data-topic]').forEach(b => b.classList.remove('active', 'topic-active'));
    if (btn.dataset.topic === 'all') {
      btn.classList.add('active');
    } else {
      btn.classList.add('topic-active');
    }
    activeTopic = btn.dataset.topic;
    currentPage = 1; render();
  }

  function filterDate(btn) {
    document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeDays  = btn.dataset.date;
    activeExact = '';
    document.getElementById('date-select').value = '';
    currentPage = 1; render();
  }

  function filterExactDate(sel) {
    activeExact = sel.value;
    if (activeExact) {
      document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
      activeDays = 'all';
    } else {
      document.querySelector('.range-btn[data-date="all"]').classList.add('active');
    }
    currentPage = 1; render();
  }

  function filterScore(btn) {
    document.querySelectorAll('#filter-bar [data-score]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeScore = parseInt(btn.dataset.score);
    currentPage = 1; render();
  }

  function filterHotness(btn) {
    document.querySelectorAll('#filter-bar [data-hotness]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeHotness    = parseInt(btn.dataset.hotness);
    activeHotnessMax = parseInt(btn.dataset.hotnessMax || 9);
    currentPage = 1; render();
  }

  function openModal() {
    document.getElementById('modal-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    document.body.style.overflow = '';
  }
  function handleOverlayClick(e) {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // 实时更新"X小时前"和发布日期显示（基于 data-iso 时间戳，使用本地时区）
  (function updateTimes() {
    const now = Date.now();
    document.querySelectorAll('.time[data-iso]').forEach(el => {
      const t = new Date(el.dataset.iso).getTime();
      if (isNaN(t)) return;
      const diff = Math.floor((now - t) / 1000);
      let text;
      if (diff < 60) text = '刚刚';
      else if (diff < 3600) text = `${Math.floor(diff/60)} 分钟前`;
      else if (diff < 86400) text = `${Math.floor(diff/3600)} 小时前`;
      else text = `${Math.floor(diff/86400)} 天前`;
      el.textContent = text;
    });
    document.querySelectorAll('.pub-date[data-iso]').forEach(el => {
      const d = new Date(el.dataset.iso);
      if (isNaN(d)) return;
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      el.textContent = `${y}-${m}-${day}`;
    });
  })();

  // 累计浏览次数（counterapi.dev，免费免账号）
  fetch('https://api.counterapi.dev/v1/afeiadian-ai-news-bot/views/up')
    .then(r => r.json())
    .then(d => {
      const n = d && d.count;
      if (typeof n === 'number') {
        document.getElementById('visit-num').textContent = n.toLocaleString();
      } else {
        document.getElementById('visit-num').textContent = '-';
      }
    })
    .catch(() => { document.getElementById('visit-num').textContent = '-'; });

  function toggleOriginal(btn, id) {
    const el = document.getElementById(id);
    const open = el.style.display === 'block';
    el.style.display = open ? 'none' : 'block';
    btn.textContent  = open ? '显示原文 ▾' : '收起 ▴';
  }

  render();
</script>

</body>
</html>
