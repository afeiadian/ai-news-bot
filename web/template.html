<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 资讯日报</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:           #fbfaf5;
      --bg-soft:      #f4f2ea;
      --surface:      #ffffff;
      --surface-alt:  #faf9f3;
      --border:       #e6e3d8;
      --border-d:     #d4d0c1;
      --text-1:       #1a1a1a;
      --text-2:       #44403c;
      --text-3:       #78716c;
      --text-4:       #a8a29e;
      --accent:       #ea580c;
      --accent-d:     #c2410c;
      --accent-soft:  #fff4ec;
      --success:      #059669;
      --warn:         #b45309;
      --radius:       8px;
      --radius-sm:    6px;
      --radius-xs:    4px;
      --shadow-sm:    0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md:    0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { background: var(--bg); }

    body {
      font-family: 'Geist', -apple-system, 'PingFang SC', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif;
      font-size: 14px;
      color: var(--text-1);
      background: var(--bg);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: 'cv11', 'ss01';
    }

    a { color: inherit; }

    ::selection { background: var(--accent); color: #fff; }

    /* ───────── HEADER ───────── */
    #header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-1);
      text-decoration: none;
    }
    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      background: var(--text-1);
      color: var(--surface);
      display: grid;
      place-items: center;
      font-family: 'Geist Mono', monospace;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: -0.02em;
      position: relative;
    }
    .brand-mark::after {
      content: '';
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--surface);
    }
    .brand-name {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-1);
    }
    .brand-sub {
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      color: var(--text-3);
      padding: 2px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      margin-left: 4px;
      letter-spacing: 0.02em;
    }
    .header-spacer { flex: 1; }
    #visit-count {
      font-family: 'Geist Mono', monospace;
      font-size: 11.5px;
      color: var(--text-3);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    #visit-count::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
    }
    #visit-count strong {
      color: var(--text-1);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    #sources-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-2);
      font-family: 'Geist', sans-serif;
      font-size: 12.5px;
      font-weight: 500;
      padding: 6px 12px;
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: all 0.12s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    #sources-btn::before {
      content: '';
      width: 12px;
      height: 12px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2371717a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><path d='M12 16v-4'/><path d='M12 8h.01'/></svg>");
      background-size: contain;
      background-repeat: no-repeat;
    }
    #sources-btn:hover {
      border-color: var(--text-1);
      color: var(--text-1);
      background: var(--bg-soft);
    }

    /* ───────── MAIN ───────── */
    #main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 28px 64px 28px;
    }

    /* ───────── FILTER BAR ───────── */
    #filter-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: var(--shadow-sm);
    }
    .filter-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .filter-label {
      font-family: 'Geist Mono', monospace;
      font-size: 10.5px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-3);
      width: 60px;
      flex-shrink: 0;
      font-weight: 500;
    }
    .filter-btn {
      font-family: 'Geist', 'PingFang SC', sans-serif;
      font-size: 12.5px;
      font-weight: 500;
      padding: 3px 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      color: var(--text-2);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.12s ease;
      border-radius: var(--radius-sm);
      letter-spacing: -0.005em;
      line-height: 1.5;
    }
    .filter-btn:hover {
      border-color: var(--border-d);
      color: var(--text-1);
      background: var(--bg-soft);
    }
    .filter-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .filter-btn.active .btn-count {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
    }
    .filter-btn.topic-active {
      background: var(--topic-color, var(--text-1));
      color: #fff;
      border-color: var(--topic-color, var(--text-1));
    }
    .filter-btn.topic-active .btn-count {
      background: rgba(255,255,255,0.22);
      color: #fff;
    }
    .btn-empty { opacity: 0.45; cursor: default; }
    .btn-empty:hover { border-color: var(--border); color: var(--text-3); background: var(--surface); }
    .btn-count {
      font-family: 'Geist Mono', monospace;
      font-size: 10px;
      background: var(--bg-soft);
      color: var(--text-3);
      padding: 0 6px;
      border-radius: 999px;
      min-width: 18px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      line-height: 1.5;
    }
    #date-select {
      font-family: 'Geist Mono', monospace;
      font-size: 11.5px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      cursor: pointer;
      border-radius: var(--radius-sm);
    }
    #date-select:hover { border-color: var(--border-d); }
    #date-select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    /* ───────── RESULT BAR ───────── */
    #result-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 4px 14px 4px;
      gap: 16px;
      flex-wrap: wrap;
    }
    #result-count {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-2);
    }
    #result-count .num {
      color: var(--text-1);
      font-weight: 600;
      font-family: 'Geist Mono', monospace;
      font-variant-numeric: tabular-nums;
    }
    #result-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    #sort-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 3px;
      border-radius: var(--radius-sm);
    }
    #sort-bar > span {
      font-family: 'Geist Mono', monospace;
      font-size: 10.5px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-3);
      padding: 0 8px 0 6px;
    }
    .sort-btn {
      font-family: 'Geist', sans-serif;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--text-3);
      transition: all 0.12s ease;
      border-radius: var(--radius-xs);
    }
    .sort-btn:hover { color: var(--text-1); }
    .sort-btn.active {
      color: #fff;
      background: var(--accent);
      font-weight: 600;
    }
    #page-info {
      font-family: 'Geist Mono', monospace;
      font-size: 11.5px;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }

    /* ───────── ITEM LIST ───────── */
    .item-list {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 8px;
    }
    .item-row td {
      padding: 0;
      vertical-align: top;
      background: var(--surface);
    }
    .item-row {
      transition: background 0.12s ease;
    }
    .item-row td:first-child {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      border-left: 1px solid var(--border);
      border-top-left-radius: var(--radius);
      border-bottom-left-radius: var(--radius);
    }
    .item-row td:last-child {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-top-right-radius: var(--radius);
      border-bottom-right-radius: var(--radius);
    }
    .item-row:hover td {
      background: #fbfbfb;
    }
    .item-row:hover td:first-child,
    .item-row:hover td:last-child {
      border-color: var(--border-d);
    }
    .item-row:hover .rank { color: var(--accent); }

    .rank {
      font-family: 'Geist Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-4);
      text-align: right;
      width: 56px;
      padding: 20px 14px 0 14px !important;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
      transition: color 0.12s ease;
    }
    .rank::before { content: '#'; opacity: 0.5; }
    .item-row .main { padding: 18px 18px 18px 0 !important; }

    .title-block {
      border-left: none;
      padding-left: 0;
      margin-bottom: 4px;
    }
    .title-link {
      font-family: 'Geist', sans-serif;
      font-weight: 600;
      font-size: 17px;
      line-height: 1.35;
      letter-spacing: -0.015em;
      color: var(--text-1);
      text-decoration: none;
      display: block;
      transition: color 0.12s ease;
    }
    .title-link:hover {
      color: var(--accent);
    }
    .title-link:visited { color: var(--text-3); }

    .title-zh {
      font-family: 'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif;
      font-size: 14.5px;
      font-weight: 500;
      color: var(--text-2);
      margin-top: 4px;
      line-height: 1.45;
      letter-spacing: -0.005em;
    }

    .topic-tags {
      margin-top: 10px;
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .summary {
      font-family: 'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif;
      font-size: 13px;
      color: var(--text-2);
      margin-top: 10px;
      line-height: 1.65;
      padding: 10px 12px;
      background: var(--bg-soft);
      border-radius: var(--radius-sm);
      border: none;
      letter-spacing: -0.003em;
    }

    .meta {
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      color: var(--text-3);
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-variant-numeric: tabular-nums;
    }
    .tag {
      font-family: 'Geist', sans-serif;
      color: #fff;
      font-size: 10.5px;
      letter-spacing: 0;
      padding: 2px 8px;
      border-radius: var(--radius-xs);
      font-weight: 500;
      line-height: 1.4;
    }
    .source-cat {
      font-family: 'Geist Mono', monospace;
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0;
      padding: 1px 7px;
      border-radius: var(--radius-xs);
      background: var(--bg-soft);
      border: 1px solid var(--border);
    }
    .source {
      color: var(--text-3);
      font-size: 11px;
      font-weight: 400;
    }
    .dot { color: var(--text-4); margin: 0 1px; }
    .score {
      color: var(--accent);
      font-weight: 500;
      font-size: 11px;
    }
    .hotness-label {
      color: var(--text-3);
      font-weight: 500;
      font-size: 11px;
      margin-right: 2px;
    }
    .stars {
      display: inline-flex;
      align-items: center;
      gap: 1px;
      margin-right: 2px;
    }
    .stars-on, .stars-off { display: inline-flex; align-items: center; gap: 1px; }
    .stars-on  { color: var(--warn); }
    .stars-off { color: var(--text-4); }
    .star-ico { display: block; }
    .pub-date {
      margin-left: auto;
      color: var(--text-3);
      font-size: 11px;
    }
    .spacer { display: none; }
    .spacer td { display: none; }

    .show-original-btn {
      font-family: 'Geist Mono', monospace;
      font-size: 10.5px;
      padding: 3px 9px;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      color: var(--text-3);
      margin-top: 10px;
      display: inline-block;
      transition: all 0.12s ease;
      border-radius: var(--radius-xs);
      font-weight: 500;
    }
    .show-original-btn:hover {
      border-color: var(--border-d);
      color: var(--text-1);
      background: var(--bg-soft);
    }

    .original-content {
      display: none;
      max-height: 260px;
      overflow-y: auto;
      margin-top: 10px;
      padding: 12px 14px;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: 'Geist Mono', monospace;
      font-size: 11.5px;
      color: var(--text-2);
      white-space: pre-wrap;
      line-height: 1.7;
      word-break: break-word;
    }
    .original-content::-webkit-scrollbar { width: 8px; }
    .original-content::-webkit-scrollbar-track { background: transparent; }
    .original-content::-webkit-scrollbar-thumb { background: var(--border-d); border-radius: 999px; }
    .original-content::-webkit-scrollbar-thumb:hover { background: var(--text-4); }

    /* ───────── PAGINATION ───────── */
    #pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 28px 0 8px 0;
      flex-wrap: wrap;
    }
    .page-btn {
      font-family: 'Geist Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      color: var(--text-2);
      min-width: 36px;
      text-align: center;
      transition: all 0.12s ease;
      border-radius: var(--radius-sm);
      font-variant-numeric: tabular-nums;
    }
    .page-btn:hover {
      border-color: var(--border-d);
      color: var(--text-1);
      background: var(--bg-soft);
    }
    .page-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .page-btn:disabled { opacity: 0.4; cursor: default; }
    .page-btn:disabled:hover { border-color: var(--border); color: var(--text-2); background: var(--surface); }
    .page-ellipsis {
      font-family: 'Geist Mono', monospace;
      font-size: 12px;
      color: var(--text-4);
      padding: 6px 4px;
    }

    /* ───────── FOOTER ───────── */
    #footer {
      text-align: center;
      padding: 28px 16px 12px;
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      color: var(--text-3);
      border-top: 1px solid var(--border);
      margin-top: 24px;
      line-height: 1.7;
    }

    /* ───────── MODAL ───────── */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 10, 0.4);
      z-index: 1000;
      overflow-y: auto;
      padding: 48px 16px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    #modal-overlay.open { display: block; animation: modalFade 0.15s ease; }
    @keyframes modalFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    #modal-box {
      background: var(--surface);
      max-width: 820px;
      margin: 0 auto;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 20px 50px -10px rgba(15, 23, 42, 0.18), 0 8px 20px -8px rgba(15, 23, 42, 0.12);
    }
    #modal-header {
      background: var(--surface);
      color: var(--text-1);
      padding: 16px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    #modal-header h2 {
      font-family: 'Geist', sans-serif;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.01em;
    }
    #modal-close {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      color: var(--text-3);
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      line-height: 1;
      padding: 0;
      display: grid;
      place-items: center;
      font-size: 14px;
      transition: all 0.12s ease;
    }
    #modal-close:hover { color: var(--text-1); background: #e5e5e5; }
    #modal-body {
      padding: 22px 26px;
      font-size: 13px;
      line-height: 1.65;
      color: var(--text-2);
    }
    .modal-section { margin-bottom: 26px; }
    .modal-section h3 {
      font-family: 'Geist', sans-serif;
      font-weight: 600;
      font-size: 13px;
      color: var(--text-1);
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 12px;
      letter-spacing: -0.005em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .modal-section h3::before {
      content: '';
      width: 3px;
      height: 14px;
      background: var(--accent);
      border-radius: 2px;
    }
    .modal-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .modal-table th {
      background: var(--bg-soft);
      text-align: left;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text-2);
      font-family: 'Geist Mono', monospace;
      font-size: 10.5px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-weight: 500;
    }
    .modal-table td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .modal-table tr:last-child td { border-bottom: none; }
    .modal-table tr:nth-child(even) td { background: var(--surface-alt); }
    .modal-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: var(--radius-xs);
      font-family: 'Geist', sans-serif;
      font-size: 10.5px;
      color: #fff;
      font-weight: 500;
      margin: 1px 2px;
    }
    .modal-note {
      background: var(--bg-soft);
      border-left: 3px solid var(--accent);
      padding: 10px 14px;
      font-size: 12.5px;
      color: var(--text-2);
      white-space: pre-line;
      line-height: 1.65;
      border-radius: var(--radius-xs);
    }

    /* ───────── RESPONSIVE ───────── */
    @media (max-width: 760px) {
      .header-inner { padding: 12px 16px; gap: 10px; flex-wrap: wrap; }
      .brand-sub { display: none; }
      #visit-count { font-size: 10.5px; }
      #main { padding: 16px 16px 48px 16px; }
      #filter-bar { padding: 12px; }
      .filter-label { width: 44px; font-size: 10px; }
      .rank { width: 40px; padding: 16px 8px 0 10px !important; font-size: 11px; }
      .item-row .main { padding: 16px 14px 16px 0 !important; }
      .title-link { font-size: 15px; }
      .title-zh { font-size: 13.5px; }
      .summary { font-size: 12.5px; }
      #result-bar { gap: 12px; padding: 18px 4px 12px 4px; }
      #result-right { width: 100%; justify-content: space-between; }
      #modal-body { padding: 18px 18px; }
      #modal-header { padding: 14px 18px; }
    }
  </style>
</head>
<body>

<div id="header">
  <div class="header-inner">
    <a class="brand" href="#">
      <span class="brand-mark">AI</span>
      <span class="brand-name">AI 资讯日报</span>
      <span class="brand-sub">数据更新时间：{{UPDATED}}</span>
    </a>
    <span class="header-spacer"></span>
    <span id="visit-count"><span>累计浏览</span> <strong id="visit-num">···</strong></span>
    <button id="sources-btn" onclick="openModal()">数据来源与筛选</button>
  </div>
</div>

<!-- 弹窗 -->
<div id="modal-overlay" onclick="handleOverlayClick(event)">
  <div id="modal-box">
    <div id="modal-header">
      <h2>数据来源 &amp; 评分标准</h2>
      <button id="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body">
      {{SOURCES_CONTENT}}
    </div>
  </div>
</div>

<div id="main">
  <div id="filter-bar">
    <!-- 日期 -->
    <div class="filter-row">
      <span class="filter-label">日期</span>
      <button class="filter-btn range-btn active" data-date="all" onclick="filterDate(this)">全部 <span class="btn-count">0</span></button>
      <button class="filter-btn range-btn" data-date="0"  onclick="filterDate(this)">今天 <span class="btn-count">0</span></button>
      <button class="filter-btn range-btn" data-date="1"  onclick="filterDate(this)">昨天 <span class="btn-count">0</span></button>
      <button class="filter-btn range-btn" data-date="3"  onclick="filterDate(this)">近3天 <span class="btn-count">0</span></button>
      <button class="filter-btn range-btn" data-date="7"  onclick="filterDate(this)">近7天 <span class="btn-count">0</span></button>
      <button class="filter-btn range-btn" data-date="30" onclick="filterDate(this)">近30天 <span class="btn-count">0</span></button>
      <select id="date-select" onchange="filterExactDate(this)">
        {{DATE_OPTIONS}}
      </select>
    </div>
    <!-- 来源分类 -->
    <div class="filter-row">
      <span class="filter-label">来源</span>
      <button class="filter-btn active" data-cat="all" onclick="filterCat(this)">全部 <span class="btn-count">{{COUNT}}</span></button>
      {{CAT_BUTTONS}}
    </div>
    <!-- 话题分类 -->
    <div class="filter-row">
      <span class="filter-label">话题</span>
      <button class="filter-btn active" data-topic="all" onclick="filterTopic(this)">全部</button>
      {{TOPIC_BUTTONS}}
    </div>
    <!-- 相关度 -->
    <div class="filter-row">
      <span class="filter-label">相关度</span>
      <button class="filter-btn active" data-score="0"  onclick="filterScore(this)">全部</button>
      <button class="filter-btn"        data-score="70" onclick="filterScore(this)">70+</button>
      <button class="filter-btn"        data-score="80" onclick="filterScore(this)">80+</button>
      <button class="filter-btn"        data-score="90" onclick="filterScore(this)">90+</button>
    </div>
    <!-- 热度 -->
    <div class="filter-row">
      <span class="filter-label">热度</span>
      <button class="filter-btn active" data-hotness="0" data-hotness-max="9" onclick="filterHotness(this)">全部</button>
      <button class="filter-btn" data-hotness="2" data-hotness-max="9" onclick="filterHotness(this)">2★+</button>
      <button class="filter-btn" data-hotness="3" data-hotness-max="9" onclick="filterHotness(this)">3★+</button>
      <button class="filter-btn" data-hotness="4" data-hotness-max="9" onclick="filterHotness(this)">4★+</button>
      <button class="filter-btn" data-hotness="5" data-hotness-max="9" onclick="filterHotness(this)">5★</button>
    </div>
  </div>

  <div id="result-bar">
    <span id="result-count"></span>
    <div id="result-right">
      <div id="sort-bar">
        <span>排序</span>
        <button class="sort-btn active" data-sort="hotness" onclick="setSort(this)">热度</button>
        <button class="sort-btn" data-sort="score" onclick="setSort(this)">相关度</button>
        <button class="sort-btn" data-sort="date" onclick="setSort(this)">时间</button>
      </div>
      <span id="page-info"></span>
    </div>
  </div>

  <table class="item-list" id="item-list">
    {{ITEMS}}
  </table>

  <div id="pagination"></div>

  <div id="footer">
    共 {{COUNT}} 条资讯 · 更新于 {{UPDATED}} · arXiv / HN / Reddit / RSS / X
  </div>
</div>

<script>
  const PAGE_SIZE = 30;
  let activeCat      = 'all';
  let activeTopic    = 'all';
  let activeDays     = 'all';
  let activeExact    = '';
  let activeScore    = 0;
  let activeHotness  = 0;
  let activeHotnessMax = 9;
  let sortBy   = 'hotness';
  let sortDesc = true;
  let currentPage = 1;

  const table   = document.getElementById('item-list');
  const allRows = Array.from(document.querySelectorAll('.item-row'));

  const spacerOf = new Map();
  allRows.forEach(row => spacerOf.set(row, row.nextElementSibling));

  function getLocalDateStr(daysAgo) {
    const d = new Date();
    d.setDate(d.getDate() - daysAgo);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function isoToLocalDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  document.querySelectorAll('.item-row[data-iso]').forEach(r => {
    r.dataset.localDate = isoToLocalDate(r.dataset.iso) || r.dataset.date;
  });

  function getVisibleRows() {
    return allRows.filter(row => {
      const catOk     = activeCat   === 'all' || row.dataset.category === activeCat;
      const topicOk   = activeTopic === 'all' || row.dataset.topic.split(',').map(t => t.trim()).includes(activeTopic);
      const scoreOk   = parseInt(row.dataset.score   || 0) >= activeScore;
      const h         = parseInt(row.dataset.hotness || 0);
      const hotnessOk = h >= activeHotness && h <= activeHotnessMax;
      let dateOk = true;
      const rowDate = row.dataset.localDate || row.dataset.date;
      if (activeExact) {
        dateOk = rowDate === activeExact;
      } else if (activeDays !== 'all') {
        dateOk = rowDate >= getLocalDateStr(parseInt(activeDays));
      }
      return catOk && topicOk && scoreOk && hotnessOk && dateOk;
    });
  }

  function sortedRows(rows) {
    const dir = sortDesc ? 1 : -1;
    return [...rows].sort((a, b) => {
      let d = 0;
      if (sortBy === 'hotness') {
        d = (parseInt(b.dataset.hotness || 0) - parseInt(a.dataset.hotness || 0)) * dir;
      } else if (sortBy === 'score') {
        d = (parseInt(b.dataset.score || 0) - parseInt(a.dataset.score || 0)) * dir;
      } else {
        d = b.dataset.date.localeCompare(a.dataset.date) * dir;
      }
      return d !== 0 ? d : b.dataset.date.localeCompare(a.dataset.date);
    });
  }

  function matchesBase(row) {
    const scoreOk = parseInt(row.dataset.score || 0) >= activeScore;
    const h = parseInt(row.dataset.hotness || 0);
    const hotnessOk = h >= activeHotness && h <= activeHotnessMax;
    let dateOk = true;
    const rowDate = row.dataset.localDate || row.dataset.date;
    if (activeExact) dateOk = rowDate === activeExact;
    else if (activeDays !== 'all') dateOk = rowDate >= getLocalDateStr(parseInt(activeDays));
    return scoreOk && hotnessOk && dateOk;
  }

  function updateFacetCounts() {
    const catCounts = {};
    let catAllTotal = 0;
    allRows.forEach(row => {
      if (!matchesBase(row)) return;
      if (activeTopic !== 'all') {
        const topics = (row.dataset.topic || '').split(',').map(t => t.trim());
        if (!topics.includes(activeTopic)) return;
      }
      const c = row.dataset.category;
      catCounts[c] = (catCounts[c] || 0) + 1;
      catAllTotal++;
    });
    document.querySelectorAll('#filter-bar [data-cat]').forEach(btn => {
      const c = btn.dataset.cat;
      const countEl = btn.querySelector('.btn-count');
      const n = c === 'all' ? catAllTotal : (catCounts[c] || 0);
      if (countEl) countEl.textContent = n;
      if (c !== 'all') {
        if (n === 0) btn.classList.add('btn-empty');
        else btn.classList.remove('btn-empty');
      }
    });

    const dateBase = allRows.filter(row => {
      const scoreOk = parseInt(row.dataset.score || 0) >= activeScore;
      const h = parseInt(row.dataset.hotness || 0);
      const hotnessOk = h >= activeHotness && h <= activeHotnessMax;
      if (!scoreOk || !hotnessOk) return false;
      if (activeCat !== 'all' && row.dataset.category !== activeCat) return false;
      if (activeTopic !== 'all') {
        const topics = (row.dataset.topic || '').split(',').map(t => t.trim());
        if (!topics.includes(activeTopic)) return false;
      }
      return true;
    });
    document.querySelectorAll('.range-btn').forEach(btn => {
      const d = btn.dataset.date;
      const countEl = btn.querySelector('.btn-count');
      if (!countEl) return;
      let n;
      if (d === 'all') n = dateBase.length;
      else {
        const cutoff = getLocalDateStr(parseInt(d));
        n = dateBase.filter(row => (row.dataset.localDate || row.dataset.date) >= cutoff).length;
      }
      countEl.textContent = n;
      if (d !== 'all') {
        if (n === 0) btn.classList.add('btn-empty');
        else btn.classList.remove('btn-empty');
      }
    });

    const topicCounts = {};
    let topicAllTotal = 0;
    allRows.forEach(row => {
      if (!matchesBase(row)) return;
      if (activeCat !== 'all' && row.dataset.category !== activeCat) return;
      const topics = (row.dataset.topic || '').split(',').map(t => t.trim()).filter(Boolean);
      if (topics.length) topicAllTotal++;
      topics.forEach(t => { topicCounts[t] = (topicCounts[t] || 0) + 1; });
    });
    document.querySelectorAll('#filter-bar [data-topic]').forEach(btn => {
      const t = btn.dataset.topic;
      const countEl = btn.querySelector('.btn-count');
      if (t === 'all') return;
      const n = topicCounts[t] || 0;
      if (countEl) countEl.textContent = n;
      if (n === 0) btn.classList.add('btn-empty');
      else btn.classList.remove('btn-empty');
    });
  }

  function render() {
    updateFacetCounts();
    const visible  = sortedRows(getVisibleRows());
    const total    = visible.length;
    const pages    = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (currentPage > pages) currentPage = pages;

    const start     = (currentPage - 1) * PAGE_SIZE;
    const pageItems = visible.slice(start, start + PAGE_SIZE);
    const pageSet   = new Set(pageItems);

    pageItems.forEach(row => {
      table.appendChild(row);
      const sp = spacerOf.get(row);
      if (sp) table.appendChild(sp);
    });
    allRows.filter(r => !pageSet.has(r)).forEach(row => {
      table.appendChild(row);
      const sp = spacerOf.get(row);
      if (sp) table.appendChild(sp);
    });

    allRows.forEach(row => {
      const show = pageSet.has(row);
      row.style.display = show ? '' : 'none';
      const sp = spacerOf.get(row);
      if (sp) sp.style.display = show ? '' : 'none';
    });

    visible.forEach((row, idx) => { row.querySelector('.rank').textContent = idx + 1; });

    document.getElementById('result-count').innerHTML =
      total === 0 ? '暂无符合条件的资讯' : `共 <span class="num">${total}</span> 条`;
    document.getElementById('page-info').textContent =
      total === 0 ? '' : `${currentPage} / ${pages}`;

    renderPagination(pages);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderPagination(pages) {
    const el = document.getElementById('pagination');
    if (pages <= 1) { el.innerHTML = ''; return; }
    let html = `<button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹</button>`;
    const range = getPageRange(currentPage, pages);
    let prev = null;
    range.forEach(p => {
      if (prev !== null && p - prev > 1) html += `<span class="page-ellipsis">…</span>`;
      html += `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="goPage(${p})">${p}</button>`;
      prev = p;
    });
    html += `<button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage === pages ? 'disabled' : ''}>›</button>`;
    el.innerHTML = html;
  }

  function getPageRange(cur, total) {
    const delta = 2, range = new Set([1, total]);
    for (let i = Math.max(2, cur - delta); i <= Math.min(total - 1, cur + delta); i++) range.add(i);
    return Array.from(range).sort((a, b) => a - b);
  }

  const SORT_LABELS = { hotness: '热度', score: '相关度', date: '时间' };

  function setSort(btn) {
    const key = btn.dataset.sort;
    if (key === sortBy) {
      sortDesc = !sortDesc;
    } else {
      sortDesc = true;
      sortBy = key;
      document.querySelectorAll('.sort-btn').forEach(b => {
        b.classList.remove('active');
        b.textContent = SORT_LABELS[b.dataset.sort] || b.dataset.sort;
      });
      btn.classList.add('active');
    }
    btn.textContent = SORT_LABELS[key] + (sortDesc ? ' ↓' : ' ↑');
    currentPage = 1;
    render();
  }

  function goPage(p) {
    const pages = Math.max(1, Math.ceil(sortedRows(getVisibleRows()).length / PAGE_SIZE));
    if (p < 1 || p > pages) return;
    currentPage = p; render();
  }

  function filterCat(btn) {
    if (btn.classList.contains('btn-empty')) return;
    document.querySelectorAll('#filter-bar [data-cat]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCat = btn.dataset.cat;
    currentPage = 1; render();
  }

  function filterTopic(btn) {
    if (btn.classList.contains('btn-empty')) return;
    document.querySelectorAll('#filter-bar [data-topic]').forEach(b => b.classList.remove('active', 'topic-active'));
    if (btn.dataset.topic === 'all') {
      btn.classList.add('active');
    } else {
      btn.classList.add('topic-active');
    }
    activeTopic = btn.dataset.topic;
    currentPage = 1; render();
  }

  function filterDate(btn) {
    if (btn.classList.contains('btn-empty')) return;
    document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeDays  = btn.dataset.date;
    activeExact = '';
    document.getElementById('date-select').value = '';
    currentPage = 1; render();
  }

  function filterExactDate(sel) {
    activeExact = sel.value;
    if (activeExact) {
      document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
      activeDays = 'all';
    } else {
      document.querySelector('.range-btn[data-date="all"]').classList.add('active');
    }
    currentPage = 1; render();
  }

  function filterScore(btn) {
    document.querySelectorAll('#filter-bar [data-score]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeScore = parseInt(btn.dataset.score);
    currentPage = 1; render();
  }

  function filterHotness(btn) {
    document.querySelectorAll('#filter-bar [data-hotness]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeHotness    = parseInt(btn.dataset.hotness);
    activeHotnessMax = parseInt(btn.dataset.hotnessMax || 9);
    currentPage = 1; render();
  }

  function openModal() {
    document.getElementById('modal-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    document.body.style.overflow = '';
  }
  function handleOverlayClick(e) {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  (function updateTimes() {
    const now = Date.now();
    document.querySelectorAll('.time[data-iso]').forEach(el => {
      const t = new Date(el.dataset.iso).getTime();
      if (isNaN(t)) return;
      const diff = Math.floor((now - t) / 1000);
      let text;
      if (diff < 60) text = '刚刚';
      else if (diff < 3600) text = `${Math.floor(diff/60)} 分钟前`;
      else if (diff < 86400) text = `${Math.floor(diff/3600)} 小时前`;
      else text = `${Math.floor(diff/86400)} 天前`;
      el.textContent = text;
    });
    document.querySelectorAll('.pub-date[data-iso]').forEach(el => {
      const d = new Date(el.dataset.iso);
      if (isNaN(d)) return;
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      el.textContent = `${y}-${m}-${day}`;
    });
  })();

  fetch('https://api.counterapi.dev/v1/afeiadian-ai-news-bot/views/up')
    .then(r => r.json())
    .then(d => {
      const n = d && d.count;
      if (typeof n === 'number') {
        document.getElementById('visit-num').textContent = n.toLocaleString();
      } else {
        document.getElementById('visit-num').textContent = '-';
      }
    })
    .catch(() => { document.getElementById('visit-num').textContent = '-'; });

  function toggleOriginal(btn, id) {
    const el = document.getElementById(id);
    const open = el.style.display === 'block';
    el.style.display = open ? 'none' : 'block';
    btn.textContent  = open ? '显示原文 ▾' : '收起 ▴';
  }

  render();
</script>

</body>
</html>
