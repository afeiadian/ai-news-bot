<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 资讯日报</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Verdana, Geneva, sans-serif;
      font-size: 14px;
      background: #f6f6ef;
      color: #000;
    }

    #header {
      background: #ff6600;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #header .logo {
      background: #fff;
      color: #ff6600;
      font-weight: bold;
      font-size: 16px;
      padding: 2px 6px;
      border-radius: 2px;
    }
    #header .site-title {
      color: #fff;
      font-weight: bold;
      font-size: 14px;
    }
    #header .nav-links {
      margin-left: auto;
      color: #fff;
      font-size: 12px;
      opacity: 0.85;
    }

    #main {
      max-width: 960px;
      margin: 0 auto;
      padding: 8px 4px;
    }

    /* 筛选栏整体 */
    #filter-bar {
      padding: 6px 4px 10px 4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-label {
      font-size: 12px;
      color: #828282;
      width: 36px;
      flex-shrink: 0;
    }

    /* 按钮通用样式 */
    .filter-btn {
      font-size: 11px;
      padding: 2px 8px;
      border: 1px solid #ccc;
      border-radius: 3px;
      background: #fff;
      cursor: pointer;
      color: #333;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .filter-btn:hover { background: #f0f0f0; }
    .filter-btn.active {
      background: #ff6600;
      color: #fff;
      border-color: #ff6600;
    }
    .filter-btn.active .btn-count {
      background: rgba(255,255,255,0.3);
    }

    .btn-count {
      font-size: 10px;
      background: #e8e8e8;
      color: #555;
      padding: 0 4px;
      border-radius: 8px;
      min-width: 18px;
      text-align: center;
    }

    /* 文章列表 */
    .item-list {
      width: 100%;
      border-collapse: collapse;
    }

    .item-row td {
      padding: 4px 4px 0 4px;
      vertical-align: top;
    }

    .rank {
      color: #828282;
      font-size: 13px;
      text-align: right;
      padding-right: 6px !important;
      width: 30px;
      padding-top: 6px !important;
    }

    .title-link {
      font-size: 14px;
      color: #000;
      text-decoration: none;
      line-height: 1.4;
    }
    .title-link:hover { text-decoration: underline; }
    .title-link:visited { color: #828282; }

    .summary {
      font-size: 12px;
      color: #444;
      margin-top: 4px;
      line-height: 1.5;
      max-width: 820px;
      padding: 4px 8px;
      background: #fffbf0;
      border-left: 3px solid #ff6600;
      border-radius: 0 2px 2px 0;
    }

    .meta {
      font-size: 11px;
      color: #828282;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .tag {
      color: #fff;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: bold;
    }

    .dot { color: #ccc; }
    .score { color: #b45309; font-weight: bold; }

    .spacer td { height: 8px; }

    /* 结果统计 */
    #result-count {
      font-size: 12px;
      color: #828282;
      padding: 0 4px 6px 4px;
    }

    #footer {
      text-align: center;
      padding: 16px;
      font-size: 11px;
      color: #828282;
      border-top: 1px solid #e0e0e0;
      margin-top: 16px;
    }

    @media (max-width: 600px) {
      .title-link { font-size: 13px; }
      #main { padding: 4px 2px; }
    }
  </style>
</head>
<body>

<div id="header">
  <span class="logo">AI</span>
  <span class="site-title">AI 资讯日报</span>
  <span class="nav-links">大模型 · AI工具 · AI芯片</span>
</div>

<div id="main">
  <div id="filter-bar">
    <!-- 日期筛选 -->
    <div class="filter-row">
      <span class="filter-label">日期：</span>
      <button class="filter-btn active" data-date="all" onclick="filterDate(this)">全部</button>
      <button class="filter-btn" data-date="0" onclick="filterDate(this)">今天</button>
      <button class="filter-btn" data-date="1" onclick="filterDate(this)">昨天</button>
      <button class="filter-btn" data-date="3" onclick="filterDate(this)">近3天</button>
      <button class="filter-btn" data-date="7" onclick="filterDate(this)">近7天</button>
      <button class="filter-btn" data-date="30" onclick="filterDate(this)">近30天</button>
    </div>
    <!-- 分类筛选 -->
    <div class="filter-row">
      <span class="filter-label">分类：</span>
      <button class="filter-btn active" data-cat="all" onclick="filterCat(this)">全部 <span class="btn-count">{{COUNT}}</span></button>
      {{CAT_BUTTONS}}
    </div>
  </div>

  <div id="result-count"></div>

  <table class="item-list" id="item-list">
    {{ITEMS}}
  </table>

  <div id="footer">
    共 {{COUNT}} 条资讯 · 更新于 {{UPDATED}} · 数据来源：arXiv / HN / Reddit / RSS
  </div>
</div>

<script>
  let activeCat = 'all';
  let activeDays = 'all';

  function getLocalDateStr(daysAgo) {
    const d = new Date();
    d.setDate(d.getDate() - daysAgo);
    return d.toISOString().slice(0, 10);
  }

  function applyFilter() {
    const rows = document.querySelectorAll('.item-row');
    let visible = 0;

    rows.forEach(row => {
      const rowCat = row.dataset.category;
      const rowDate = row.dataset.date;
      const spacer = row.nextElementSibling;

      const catOk = activeCat === 'all' || rowCat === activeCat;

      let dateOk = true;
      if (activeDays !== 'all') {
        const cutoff = getLocalDateStr(parseInt(activeDays));
        dateOk = rowDate >= cutoff;
      }

      const show = catOk && dateOk;
      row.style.display = show ? '' : 'none';
      if (spacer) spacer.style.display = show ? '' : 'none';
      if (show) visible++;
    });

    // 重新编号
    let n = 1;
    rows.forEach(row => {
      if (row.style.display !== 'none') {
        row.querySelector('.rank').textContent = n++;
      }
    });

    document.getElementById('result-count').textContent =
      visible > 0 ? `显示 ${visible} 条` : '暂无符合条件的资讯';
  }

  function filterCat(btn) {
    document.querySelectorAll('[data-cat]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCat = btn.dataset.cat;
    applyFilter();
  }

  function filterDate(btn) {
    document.querySelectorAll('[data-date]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeDays = btn.dataset.date;
    applyFilter();
  }

  // 初始化显示数量
  applyFilter();
</script>

</body>
</html>
