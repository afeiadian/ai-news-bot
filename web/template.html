<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 资讯日报</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Verdana, Geneva, sans-serif;
      font-size: 14px;
      background: #f6f6ef;
      color: #000;
    }

    #header {
      background: #ff6600;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #header .logo {
      background: #fff;
      color: #ff6600;
      font-weight: bold;
      font-size: 16px;
      padding: 2px 6px;
      border-radius: 2px;
    }
    #header .site-title { color: #fff; font-weight: bold; font-size: 14px; }
    #header .nav-links { margin-left: auto; color: #fff; font-size: 12px; opacity: 0.85; }

    #main {
      max-width: 960px;
      margin: 0 auto;
      padding: 8px 4px;
    }

    #filter-bar {
      padding: 6px 4px 10px 4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-label {
      font-size: 12px;
      color: #828282;
      width: 36px;
      flex-shrink: 0;
    }

    .filter-btn {
      font-size: 11px;
      padding: 2px 8px;
      border: 1px solid #ccc;
      border-radius: 3px;
      background: #fff;
      cursor: pointer;
      color: #333;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .filter-btn:hover { background: #f0f0f0; }
    .filter-btn.active {
      background: #ff6600;
      color: #fff;
      border-color: #ff6600;
    }
    .filter-btn.active .btn-count { background: rgba(255,255,255,0.3); color: #fff; }

    .btn-count {
      font-size: 10px;
      background: #e8e8e8;
      color: #555;
      padding: 0 4px;
      border-radius: 8px;
      min-width: 18px;
      text-align: center;
    }

    .item-list { width: 100%; border-collapse: collapse; }

    .item-row td { padding: 4px 4px 0 4px; vertical-align: top; }

    .rank {
      color: #828282;
      font-size: 13px;
      text-align: right;
      padding-right: 6px !important;
      width: 30px;
      padding-top: 6px !important;
    }

    .title-link {
      font-size: 14px;
      color: #000;
      text-decoration: none;
      line-height: 1.4;
    }
    .title-link:hover { text-decoration: underline; }
    .title-link:visited { color: #828282; }

    .summary {
      font-size: 12px;
      color: #444;
      margin-top: 4px;
      line-height: 1.5;
      max-width: 820px;
      padding: 4px 8px;
      background: #fffbf0;
      border-left: 3px solid #ff6600;
      border-radius: 0 2px 2px 0;
    }

    .meta {
      font-size: 11px;
      color: #828282;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .tag {
      color: #fff;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: bold;
    }

    .dot { color: #ccc; }
    .score { color: #b45309; font-weight: bold; }
    .spacer td { height: 8px; }

    /* 结果统计栏 */
    #result-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px 8px 4px;
      font-size: 12px;
      color: #828282;
    }

    /* 分页 */
    #pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 16px 4px 8px 4px;
      flex-wrap: wrap;
    }

    .page-btn {
      font-size: 12px;
      padding: 3px 9px;
      border: 1px solid #ccc;
      border-radius: 3px;
      background: #fff;
      cursor: pointer;
      color: #333;
      min-width: 30px;
      text-align: center;
    }
    .page-btn:hover { background: #f0f0f0; }
    .page-btn.active {
      background: #ff6600;
      color: #fff;
      border-color: #ff6600;
      font-weight: bold;
    }
    .page-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }
    .page-ellipsis {
      font-size: 12px;
      color: #828282;
      padding: 3px 4px;
    }

    #footer {
      text-align: center;
      padding: 16px;
      font-size: 11px;
      color: #828282;
      border-top: 1px solid #e0e0e0;
      margin-top: 8px;
    }

    @media (max-width: 600px) {
      .title-link { font-size: 13px; }
      #main { padding: 4px 2px; }
    }
  </style>
</head>
<body>

<div id="header">
  <span class="logo">AI</span>
  <span class="site-title">AI 资讯日报</span>
  <span class="nav-links">大模型 · AI工具 · AI芯片</span>
</div>

<div id="main">
  <div id="filter-bar">
    <div class="filter-row">
      <span class="filter-label">日期：</span>
      <button class="filter-btn active" data-date="all" onclick="filterDate(this)">全部</button>
      <button class="filter-btn" data-date="0" onclick="filterDate(this)">今天</button>
      <button class="filter-btn" data-date="1" onclick="filterDate(this)">昨天</button>
      <button class="filter-btn" data-date="3" onclick="filterDate(this)">近3天</button>
      <button class="filter-btn" data-date="7" onclick="filterDate(this)">近7天</button>
      <button class="filter-btn" data-date="30" onclick="filterDate(this)">近30天</button>
    </div>
    <div class="filter-row">
      <span class="filter-label">分类：</span>
      <button class="filter-btn active" data-cat="all" onclick="filterCat(this)">全部 <span class="btn-count">{{COUNT}}</span></button>
      {{CAT_BUTTONS}}
    </div>
  </div>

  <div id="result-bar">
    <span id="result-count"></span>
    <span id="page-info"></span>
  </div>

  <table class="item-list" id="item-list">
    {{ITEMS}}
  </table>

  <div id="pagination"></div>

  <div id="footer">
    共 {{COUNT}} 条资讯 · 更新于 {{UPDATED}} · 数据来源：arXiv / HN / Reddit / RSS
  </div>
</div>

<script>
  const PAGE_SIZE = 30;
  let activeCat  = 'all';
  let activeDays = 'all';
  let currentPage = 1;

  // 所有文章行（item-row 和对应的 spacer）
  const allRows = Array.from(document.querySelectorAll('.item-row'));

  function getLocalDateStr(daysAgo) {
    const d = new Date();
    d.setDate(d.getDate() - daysAgo);
    return d.toISOString().slice(0, 10);
  }

  // 计算哪些行通过筛选
  function getVisibleRows() {
    return allRows.filter(row => {
      const catOk = activeCat === 'all' || row.dataset.category === activeCat;
      let dateOk = true;
      if (activeDays !== 'all') {
        const cutoff = getLocalDateStr(parseInt(activeDays));
        dateOk = row.dataset.date >= cutoff;
      }
      return catOk && dateOk;
    });
  }

  function render() {
    const visible = getVisibleRows();
    const total   = visible.length;
    const pages   = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (currentPage > pages) currentPage = pages;

    const start = (currentPage - 1) * PAGE_SIZE;
    const end   = start + PAGE_SIZE;
    const pageRows = new Set(visible.slice(start, end));

    // 显示/隐藏每一行及其 spacer
    allRows.forEach(row => {
      const show = pageRows.has(row);
      row.style.display = show ? '' : 'none';
      const spacer = row.nextElementSibling;
      if (spacer) spacer.style.display = show ? '' : 'none';
    });

    // 重新编号（全局序号，跨页连续）
    visible.forEach((row, idx) => {
      row.querySelector('.rank').textContent = idx + 1;
    });

    // 更新统计文字
    const countEl = document.getElementById('result-count');
    const pageInfoEl = document.getElementById('page-info');
    if (total === 0) {
      countEl.textContent = '暂无符合条件的资讯';
      pageInfoEl.textContent = '';
    } else {
      countEl.textContent = `共 ${total} 条`;
      pageInfoEl.textContent = `第 ${currentPage} / ${pages} 页`;
    }

    renderPagination(pages);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderPagination(pages) {
    const el = document.getElementById('pagination');
    if (pages <= 1) { el.innerHTML = ''; return; }

    let html = '';

    // 上一页
    html += `<button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹ 上一页</button>`;

    // 页码按钮（带省略号）
    const range = getPageRange(currentPage, pages);
    let prev = null;
    range.forEach(p => {
      if (prev !== null && p - prev > 1) {
        html += `<span class="page-ellipsis">…</span>`;
      }
      html += `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="goPage(${p})">${p}</button>`;
      prev = p;
    });

    // 下一页
    html += `<button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage === pages ? 'disabled' : ''}>下一页 ›</button>`;

    el.innerHTML = html;
  }

  // 生成要显示的页码列表（首、尾、当前附近各显示）
  function getPageRange(cur, total) {
    const delta = 2;
    const range = new Set([1, total]);
    for (let i = Math.max(2, cur - delta); i <= Math.min(total - 1, cur + delta); i++) {
      range.add(i);
    }
    return Array.from(range).sort((a, b) => a - b);
  }

  function goPage(p) {
    const pages = Math.max(1, Math.ceil(getVisibleRows().length / PAGE_SIZE));
    if (p < 1 || p > pages) return;
    currentPage = p;
    render();
  }

  function filterCat(btn) {
    document.querySelectorAll('[data-cat]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCat = btn.dataset.cat;
    currentPage = 1;
    render();
  }

  function filterDate(btn) {
    document.querySelectorAll('[data-date]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeDays = btn.dataset.date;
    currentPage = 1;
    render();
  }

  // 初始化
  render();
</script>

</body>
</html>
