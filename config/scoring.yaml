# 相关度评分配置
# 修改此文件即可调整评分标准，无需改动代码

# 全局参考阈值：DeepSeek 评分阶段（processor/process.py）的"相关"基准线
# 网页生成阶段的真实筛选规则见下方 category_filters
min_score: 70

# 各来源类别独立筛选(按"每日"维度)
# 网页生成时不再将所有来源混合后用统一阈值过滤，
# 改为每个 category × 每个发布日期 分别按 score 降序排序后，
# 套用各自的 min_score (录用分数线) 和 max_articles (该来源每日上限)。
# 历史范围由 30 天数据保留期统一控制,不另设全局总数上限。
# 配置中未列出的来源类别会被排除（例如已下线的历史来源 Reddit）。
category_filters:
  arXiv:        { min_score: 70, max_articles: 30 }
  X:            { min_score: 50, max_articles: 60 }
  Hacker News:  { min_score: 50, max_articles: 30 }
  AI Lab:       { min_score: 50, max_articles: 30 }
  AI Chip:      { min_score: 50, max_articles: 30 }
  AI Tools:     { min_score: 50, max_articles: 30 }
  Newsletter:   { min_score: 50, max_articles: 30 }

# 评分原则：以"对 AI 芯片硬件 / 软件栈开发者的工程价值"为最高优先级
# 高分（80+）：芯片相关性强（硬件特性优化 / 算子级性能优化 / 软件栈适配 / SOTA 算子库）
# 中分（65-79）：AI 相关但缺乏芯片 / 软件栈维度的工程深度
# 低分（<65）：弱相关或无关，应过滤
quality_note: |
  【核心收录主线 — AI 芯片硬件与软件栈强相关】

  本资讯主要服务于 AI 芯片硬件与软件栈开发者，
  最高优先级是判断文章对该群体的工程价值。
  凡满足以下四类任一条件，视为强相关（评分区间 80–95）；多类同时满足取上限。

  ① AI 芯片硬件特性 → 功耗 / 性能 / 延迟优化
     - 新硬件架构、内存层级、互联拓扑（NVLink / InfiniBand / UB / PCIe）、新型计算单元
     - 实测能效比、算力利用率（MFU/HFU）、显存带宽与延迟瓶颈分析
     - 数据中心 / 推理集群级硬件优化
     - GPU / NPU / TPU / ASIC 新品发布、实测性能、对比评测
     - 国产 / 国际 AI 芯片对比、行业格局变化

  ② 算法 / 算子性能优化 → 可下沉到软件栈直接带来收益
     - 新算子、kernel 优化、内存访问模式、流水线编排
     - 并行策略（TP / PP / EP / SP / CP / Ulysses）的具体实现与实测加速
     - 量化（GPTQ / AWQ / FP8 / FP6 / INT4）、稀疏化在具体硬件上的加速数据
     - 推理优化（continuous batching、PagedAttention、KV cache 压缩、speculative decoding）
     - 训练优化（gradient accumulation、activation checkpoint、ZeRO、混合精度）

  ③ 热门软件栈 / 工具 / 组件 / 新特性 → 需要 AI 芯片适配以满足兼容性
     - 推理框架（vLLM、SGLang、TensorRT-LLM、llama.cpp、MLC-LLM）新版本 / 新特性
     - 训练框架（Megatron-LM、Megatron-Core、DeepSpeed、FSDP、TorchTitan、ColossalAI）更新
     - 编译器栈（Triton、XLA、TVM、MLIR、Mojo、Hidet）新特性
     - 主流模型新发布且对推理栈有新需求（新 attention 变体、新量化格式、新数据类型）
     - 国产芯片需要适配的主流软件特性、生态进展

  ④ SOTA 算法 / 算子 / 软件库 → 对芯片适配优化有参考价值
     - SOTA attention 实现（FlashAttention 系列、Ring / Tree / Star Attention、Native Sparse Attention）
     - 高性能算子库（FlashInfer、CUTLASS、xformers、cuDNN、ThunderKittens 等的重要更新）
     - 主流框架的 reference 高性能内核
     - SOTA 量化 / 稀疏化方法及其 reference 实现

  【中等相关 — 65–80 分】
  - 大模型新发布、能力评测、产品动态（缺乏芯片 / 软件栈层面的工程深度）
  - AI 公司动态、融资、组织调整（限重大事件）
  - 一般性研究综述、宏观趋势预测

  【弱相关 / 周边 — 50–65 分】
  - 应用层产品演示、行业用例（无底层技术细节）
  - 与底层硬件 / 软件栈无直接关联的 AI 研究

  【明确排除，直接给分 ≤ 30】
  - 非 AI 领域科技新闻（手机、电动车、区块链、量子计算等）
  - 纯商业 / 财经 / 政治新闻（融资除非涉及 AI 核心公司且金额重大）
  - AI 作为噱头的泛应用报道（AI 写作工具、AI 客服等边缘应用）
  - 传统 CV / NLP 小模型任务（与大模型 / 芯片无关）
  - X 平台上的个人生活、时事评论、非 AI 话题发言（即使来自知名人物）

  【来源权威性辅助】在内容符合主线时叠加（+5~+15）：
  - 顶级 AI 公司官方博客：OpenAI、Anthropic、Google Research、DeepMind、NVIDIA、Meta AI
  - 行业领袖 X 发文（内容涉及 AI 技术 / 产品 / 趋势）：Karpathy、LeCun、Sam Altman、Dario Amodei、Demis Hassabis 等
  - 顶级机构论文：Google / Meta / Microsoft / OpenAI / Anthropic / NVIDIA 及 MIT / Stanford / CMU / Berkeley

  【arXiv 严格筛选】须满足任一项才能 ≥ 70 分：
  1. 直接服务于推理 / 训练 / 芯片工程优化（对应主线 ②③④）
  2. 顶级机构 + SOTA 声称且有具体性能数据
  3. 新硬件特性下的算法 / 系统级创新
  cs.CL 过滤：纯语言学 / 小型垂直 NLP 模型 → ≤ 40 分
  cs.CV 过滤：传统图像分类 / 目标检测 / 医学影像 → ≤ 35 分；文生视频 / 多模态 VLM → 按主线评分

  【X 平台 / Hacker News 拓宽政策】
  这两个来源(source = X 或 Hacker News)是 AI 信息发现的主渠道，
  除了核心收录主线外，对广义 AI 内容也应宽容收录。
  允许覆盖：AI 算法、模型、软件、硬件、工具、研究、行业风向、技术观点等。

  评分细则:
  - 涉及核心主线 ①②③④ 的具体技术 / 产品讨论 → 80–95 分
  - 重要 AI 算法 / 新模型 / 新论文讨论（即使未触及芯片或软件栈层面）→ 70–85 分
  - AI 行业新动态 / 新产品 / 新工具的早期信号 → 65–80 分
  - 知名 AI 研究者 / 工程师的技术观点、风向判断、深度评论 → 65–80 分
  - 仅提到 AI 公司 / 模型 / 工具名称（哪怕只是名字 + 一句话）→ 60–70 分
  - 谈到 AI 行业、趋势、应用场景的简短观点 → 60–70 分
  - 完全无关 AI 的个人生活、政治、火箭、汽车、感叹词 → ≤ 30 分

  判断原则：宁可错收、不要漏。只要内容是 AI 技术 / 行业的有效信号
  （而非噱头、泛娱乐、非 AI 话题），就值得纳入 60+ 分。
  对 AI 相关产品名称（Codex、Grok、Claude、ChatGPT、Gemini、Llama、Sora 等）的
  任何提及一律视为 AI 内容。

# 关注的技术领域
domains:
  - name: AI 芯片与硬件
    description: GPU/NPU/TPU 等 AI 芯片的设计与架构；AI 服务器、数据中心硬件；芯片互联（NVLink/InfiniBand/PCIe）；NVIDIA/AMD/Intel/国产芯片产品动态与技术评测

  - name: AI 芯片软件栈
    description: AI 芯片配套软件生态，包括 CUDA/ROCm/XLA/OneAPI 等编程框架；cuDNN/cuBLAS 等算子库；AI 编译器（TVM/Triton/XLA）；Kernel 开发与优化；芯片软件适配与移植；软硬件协同优化

  - name: 模型推理与部署
    description: 推理加速框架（vLLM/SGLang/TensorRT-LLM/llama.cpp）；量化技术（GPTQ/AWQ/FP8/INT4）；推理 serving 架构；批处理与调度优化；边缘/端侧部署；推理性能显著提升的技术创新

  - name: 模型训练与微调
    description: 预训练技术与数据工程；SFT/RLHF/DPO 等对齐方法；分布式训练（Megatron-LM/DeepSpeed/FSDP）；训练效率优化；参数高效微调（LoRA/QLoRA）；训练基础设施

  - name: AI 开发框架与工具
    description: 提升模型开发或应用构建效率的框架与工具（LangChain/LlamaIndex/Transformers等）；性能 Profiling 与调试工具；Benchmark 测评框架；显著提升易用性或开发效率的创新工具

  - name: 大模型技术与应用
    description: 基础大模型架构创新（Transformer 变体、MoE、SSM 等）；新模型发布与能力评测；多模态模型；模型优缺点分析与对比；大模型在各行业的落地应用；权威趋势预测与技术综述

# 话题分类（用于文章自动打标签）
# name 必须与 generate.py 中 ALL_TOPICS 保持一致
topics:
  - name: 基础大模型
    description: 新模型发布、模型能力评测、模型架构创新（MoE/SSM等）、多模态模型

  - name: 推理部署
    description: 推理加速、量化（GPTQ/AWQ/FP8）、vLLM/SGLang/TensorRT-LLM、serving架构、边缘部署

  - name: 训练微调
    description: 预训练、SFT、RLHF、DPO、分布式训练、数据集构建、参数高效微调

  - name: 性能优化
    description: 系统级性能优化：算子/Kernel优化、内存优化、并行策略、CUDA/Triton优化、吞吐量与延迟改善

  - name: 芯片软件栈
    description: AI芯片配套软件：CUDA/ROCm/XLA、编译器、算子库、Kernel开发、芯片软件适配与移植

  - name: AI芯片硬件
    description: GPU/NPU/TPU芯片架构与产品、AI数据中心硬件、芯片互联技术、芯片产品发布与评测

  - name: 开发工具
    description: AI应用开发框架、SDK、Agent框架、RAG工具链、Profiling与调试工具

  - name: 学术论文
    description: arXiv论文、顶会研究成果、Benchmark测评报告

  - name: 行业资讯
    description: 公司动态、融资、产品发布、权威趋势预测与综述、技术路线分析
