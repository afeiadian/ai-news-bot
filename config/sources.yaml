    name: "Andrej Karpathy"
  - handle: ylecun
    name: "Yann LeCun"
  - handle: sama
    name: "Sam Altman"
  - handle: AnthropicAI
    name: "Anthropic"
  - handle: OpenAI
    name: "OpenAI"
  - handle: GoogleDeepMind
    name: "Google DeepMind"
  - handle: huggingface
    name: "Hugging Face"
  - handle: nvidia
    name: "NVIDIA"
