name: Daily News Update

on:
  schedule:
    - cron: '0 7 * * *'   # 每天 07:00 UTC = 北京时间 15:00
                          # 必须晚于 arXiv 当日内容入库时间（约 UTC 06:00）
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r processor/requirements.txt

      - name: Write .env
        run: |
          cat > .env << EOF
          MINIFLUX_URL=${{ secrets.MINIFLUX_URL }}
          MINIFLUX_API_KEY=${{ secrets.MINIFLUX_API_KEY }}
          RSSHUB_URL=${{ secrets.RSSHUB_URL }}
          DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL=${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL=${{ secrets.DEEPSEEK_MODEL }}
          TWITTER_AUTH_TOKEN=${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0=${{ secrets.TWITTER_CT0 }}
          EOF

      - name: Fetch and process articles
        run: cd processor && python3 run.py

      - name: Backfill missing topics
        run: cd processor && python3 backfill_topic.py

      - name: Backfill missing hotness
        run: cd processor && python3 backfill_hotness.py

      - name: Generate webpage
        run: cd processor && python3 generate.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.db docs/index.html
          git diff --cached --quiet || git commit -m "chore: daily update $(date -u '+%Y-%m-%d')"
          # 拉取远程最新更改，冲突时优先保留 Actions 抓取的新数据（-X ours）
          git fetch origin main
          git merge -X ours --no-edit origin/main || true
          git push
